<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Memory Rack</title>
<style>
  body { margin: 0; background: #0b0f19; color: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; box-sizing: border-box; font-size: 15px; }
  .b { font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #00e5ff; margin-bottom: 10px; }
  button { margin-top: 14px; background: #0284c7; color: #fff; border: 0; border-radius: 10px; padding: 11px 18px; font-size: 15px; font-weight: 700; }
</style></head>
<body><div><div class="b">VITROX · MEMORY RACK</div><div id="m">Loading rack…</div><div id="r"></div></div>
<script>
    // ViTrox Memory Rack: public phone page. This file holds no rack data and no PIN.
    // Everything is loaded from the rack script; changes need the 6-digit PIN (checked by the script).
    var API = "https://script.google.com/macros/s/AKfycbwQ3NeZjULgIl8CG4h3KwGQkd1rrd2GqD_Y8oNFKUp1KLyQGXy0GD0Rl3JkHZxdgaxVFA/exec";
    function show(msg, retry) {
      document.getElementById("m").textContent = msg;
      var r = document.getElementById("r"); r.innerHTML = "";
      if (retry) { var b = document.createElement("button"); b.textContent = "Try again"; b.onclick = load; r.appendChild(b); }
    }
    function load() {
      show("Loading rack…");
      var q = new URLSearchParams(location.search);
      fetch(API, { method: "POST", credentials: "omit", redirect: "follow",
        body: JSON.stringify({ a: "page", b: q.get("b") || q.get("bin") || "", p: q.get("p") || q.get("part") || "", api: API }) })
        .then(function(r) { return r.text(); })
        .then(function(t) {
          var j = null; try { j = JSON.parse(t); } catch (e) {}
          if (!j || !j.html) { show((j && j.error_) || "The rack did not answer.", true); return; }
          document.open(); document.write(j.html); document.close();
        })
        .catch(function() { show("No connection to the rack.", true); });
    }
    load();
</script></body></html>
